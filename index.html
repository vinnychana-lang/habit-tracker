<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="theme-color" content="#007AFF">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>Habits</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #007AFF;
      --green:  #34C759;
      --indigo: #5856D6;
      --orange: #FF9500;
      --pink:   #FF2D55;
      --purple: #AF52DE;
      --teal:   #5AC8FA;
      --yellow: #FFD60A;
      --bg:     #F2F2F7;
      --card:   #FFFFFF;
      --label:  #000000;
      --label2: #3C3C43;
      --label3: rgba(60,60,67,0.55);
      --sep:    rgba(60,60,67,0.29);
      --fill:   rgba(120,120,128,0.16);
      --glass:  rgba(249,249,249,0.92);
      --radius: 14px;
      --safe-top:    env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:    #000000;
        --card:  #1C1C1E;
        --label: #FFFFFF;
        --label2:#EBEBF5;
        --label3:rgba(235,235,245,0.55);
        --sep:   rgba(84,84,88,0.6);
        --fill:  rgba(120,120,128,0.32);
        --glass: rgba(28,28,30,0.92);
      }
    }

    html, body {
      height: 100%; overflow: hidden;
      font-family: -apple-system, system-ui, 'SF Pro Text', sans-serif;
      background: var(--bg); color: var(--label);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #app { display: flex; flex-direction: column; height: 100%; }

    .screen {
      display: none; flex: 1;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-bottom: calc(90px + var(--safe-bottom));
    }
    .screen.active { display: block; }

    /* ── Large-title nav bar (iOS 11+ style) ── */
    .nav-bar {
      padding-top: var(--safe-top);
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 0.5px solid var(--sep);
      position: sticky; top: 0; z-index: 10;
    }
    .nav-small {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 20px 4px;
    }
    .nav-small-title {
      font-size: 17px; font-weight: 600; letter-spacing: -0.4px;
    }
    .nav-large-title {
      font-size: 34px; font-weight: 700; letter-spacing: -1px;
      padding: 2px 20px 12px;
    }
    .nav-date-pill {
      background: var(--blue);
      color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    /* ── Tab bar ── */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding-bottom: var(--safe-bottom);
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-top: 0.5px solid var(--sep);
      display: flex; z-index: 100;
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      padding: 10px 0 3px;
      background: none; border: none;
      color: var(--label3);
      font-size: 10px; font-weight: 500;
      cursor: pointer; transition: color 0.15s;
    }
    .tab-btn.active { color: var(--blue); }
    .tab-icon { font-size: 22px; line-height: 1; }

    /* ── Progress ring card ── */
    .progress-card {
      margin: 16px 16px 4px;
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      border-radius: 20px;
      padding: 20px;
      display: flex; align-items: center; gap: 18px;
      box-shadow: 0 8px 24px rgba(0,122,255,0.28), 0 2px 8px rgba(0,0,0,0.12);
    }
    .ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-bg   { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 8; }
    .ring-fill {
      fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ring-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; color: #fff;
    }
    .progress-info { flex: 1; }
    .progress-title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .progress-sub   { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 3px; }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.22); border-radius: 6px;
      height: 6px; margin-top: 12px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: #fff; border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ── Section header ── */
    .section-header {
      font-size: 13px; font-weight: 600;
      color: var(--label3); text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 20px 20px 7px;
    }

    /* ── Habit group (inset list) ── */
    .habit-group {
      margin: 0 16px;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow:
        0 1px 0 rgba(0,0,0,0.04),
        0 2px 8px rgba(0,0,0,0.06);
    }

    .habit-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px;
      position: relative; cursor: pointer;
      transition: background 0.12s;
      min-height: 62px;
    }
    .habit-row:active { background: var(--fill); }
    .habit-row.disabled { opacity: 0.38; cursor: default; }
    .habit-row + .habit-row::before {
      content: ''; position: absolute; top: 0; left: 66px; right: 0;
      height: 0.5px; background: var(--sep);
    }

    /* Icon circle */
    .habit-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }

    .habit-info { flex: 1; min-width: 0; }
    .habit-name {
      font-size: 16px; font-weight: 500; letter-spacing: -0.3px;
      display: flex; align-items: center; gap: 6px;
    }
    .sunday-badge {
      font-size: 10px; font-weight: 600;
      background: var(--purple); color: #fff;
      padding: 2px 6px; border-radius: 6px;
      letter-spacing: 0.3px;
    }
    .habit-meta {
      font-size: 12px; color: var(--label3); margin-top: 2px;
    }

    /* iOS-style checkbox */
    .check-circle {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid var(--sep);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      background: transparent;
    }
    .check-circle.done {
      background: var(--green); border-color: var(--green);
      box-shadow: 0 2px 8px rgba(52,199,89,0.4);
    }
    .check-circle svg {
      opacity: 0; transform: scale(0.3) rotate(-10deg);
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .check-circle.done svg { opacity: 1; transform: scale(1) rotate(0deg); }

    /* ── History ── */
    .history-section { margin: 16px 16px 0; }
    .history-head {
      font-size: 22px; font-weight: 700; letter-spacing: -0.6px;
      margin-bottom: 12px;
    }

    .week-grid {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .week-header {
      display: grid; grid-template-columns: 120px repeat(7, 1fr);
      padding: 10px 14px 7px; border-bottom: 0.5px solid var(--sep);
    }
    .week-header span {
      font-size: 11px; font-weight: 600; color: var(--label3); text-align: center;
    }
    .week-header span:first-child { text-align: left; }

    .history-row {
      display: grid; grid-template-columns: 120px repeat(7, 1fr);
      align-items: center; padding: 8px 14px; position: relative;
    }
    .history-row + .history-row::before {
      content: ''; position: absolute; top: 0; left: 14px; right: 14px;
      height: 0.5px; background: var(--sep);
    }
    .history-habit-name {
      font-size: 12px; font-weight: 500;
      display: flex; align-items: center; gap: 5px;
      overflow: hidden;
    }
    .day-dot-wrap { display: flex; justify-content: center; }
    .day-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--fill);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: background 0.2s;
    }
    .day-dot.done { background: var(--green); }
    .day-dot.na   { background: transparent; }
    .day-dot.today-ring { box-shadow: 0 0 0 1.5px var(--blue); }
    .day-dot.done.today-ring { box-shadow: 0 0 0 1.5px var(--green); }

    /* ── Stat cards ── */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin: 12px 16px 0;
    }
    .stat-card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 10px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-num {
      font-size: 26px; font-weight: 700; letter-spacing: -1px; color: var(--blue);
    }
    .stat-label { font-size: 11px; color: var(--label3); margin-top: 2px; font-weight: 500; }

    /* ── Animations ── */
    @keyframes pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.22); }
      65%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    .popping { animation: pop 0.38s cubic-bezier(0.34,1.56,0.64,1); }
  </style>
</head>
<body>
<div id="app">

  <!-- TODAY -->
  <div class="screen active" id="screen-today">
    <div class="nav-bar">
      <div class="nav-small">
        <div class="nav-small-title">My Habits</div>
        <div class="nav-date-pill" id="nav-date-pill"></div>
      </div>
      <div class="nav-large-title" id="large-title">Today</div>
    </div>

    <div class="progress-card">
      <div class="ring-wrap">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle class="ring-bg" cx="40" cy="40" r="34"/>
          <circle class="ring-fill" id="ring-fill" cx="40" cy="40" r="34"
            stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
        </svg>
        <div class="ring-text" id="ring-pct">0%</div>
      </div>
      <div class="progress-info">
        <div class="progress-title" id="prog-title">Let's go!</div>
        <div class="progress-sub" id="prog-sub"></div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="section-header">Daily Habits</div>
    <div class="habit-group" id="habit-list"></div>
    <div style="height:12px"></div>
  </div>

  <!-- HISTORY -->
  <div class="screen" id="screen-history">
    <div class="nav-bar">
      <div class="nav-small">
        <div class="nav-small-title">History</div>
      </div>
      <div class="nav-large-title">History</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-today">—</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-week">—</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-streak">—</div>
        <div class="stat-label">Best Streak</div>
      </div>
    </div>

    <div class="history-section">
      <div class="history-head">Last 7 Days</div>
      <div class="week-grid">
        <div class="week-header" id="week-header"><span>Habit</span></div>
        <div id="history-rows"></div>
      </div>
    </div>
    <div style="height:12px"></div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today" onclick="switchTab('today')">
      <span class="tab-icon">☀️</span>Today
    </button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
      <span class="tab-icon">📊</span>History
    </button>
  </div>
</div>

<script>
// Habits in alphabetical order; microneedle is Sunday-only (sundayOnly: true)
const HABITS = [
  { id: 'dutasteride',  name: 'Dutasteride',   emoji: '💊', color: '#AF52DE' },
  { id: 'gym',          name: 'Gym',            emoji: '🏋️', color: '#FF9500' },
  { id: 'microneedle',  name: 'Microneedle',   emoji: '🪡', color: '#007AFF', sundayOnly: true },
  { id: 'omega_3',      name: 'Omega 3',        emoji: '🐟', color: '#5AC8FA' },
  { id: 'oral_min',     name: 'Oral Minoxidil', emoji: '💊', color: '#5856D6' },
  { id: 'scalp',        name: 'Scalp Massage',  emoji: '💆', color: '#FF2D55' },
  { id: 'sleep',        name: 'Sleep Stack',    emoji: '😴', color: '#34C759' },
  { id: 'vitamin_d',    name: 'Vitamin D',      emoji: '☀️', color: '#FFD60A' },
];

const KEY = 'habitTracker';

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function isSunday(dateKey) {
  return new Date(dateKey + 'T12:00:00').getDay() === 0;
}

function activeHabits(dateKey) {
  return HABITS.filter(h => !h.sundayOnly || isSunday(dateKey));
}

function getData() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function setData(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

function toggle(habitId) {
  const key = todayKey();
  if (HABITS.find(h=>h.id===habitId)?.sundayOnly && !isSunday(key)) return;
  const all = getData();
  if (!all[key]) all[key] = {};
  all[key][habitId] = !all[key][habitId];
  setData(all);
  renderToday();
}

function getStreak(habitId) {
  const all = getData();
  let streak = 0;
  const d = new Date(); d.setDate(d.getDate()-1);
  while (true) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const habit = HABITS.find(h=>h.id===habitId);
    if (habit?.sundayOnly && !isSunday(k)) { d.setDate(d.getDate()-1); continue; }
    if (all[k]?.[habitId]) { streak++; d.setDate(d.getDate()-1); } else break;
    if (streak > 365) break;
  }
  return streak;
}

function renderToday() {
  const key = todayKey();
  const today = getData()[key] || {};
  const active = activeHabits(key);
  const done = active.filter(h => today[h.id]).length;
  const total = active.length;
  const pct = total ? Math.round(done/total*100) : 0;

  // Ring (circumference = 2π×34 ≈ 213.6)
  const circ = 213.6;
  document.getElementById('ring-fill').style.strokeDashoffset = circ - (circ * done / total);
  document.getElementById('ring-pct').textContent = pct + '%';
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-sub').textContent = `${done} of ${total} habits done`;

  const msgs = ['Let\'s go! 💪','Great start!','Halfway there! 🔥','Almost done! ⚡','Killing it! 🏆','Perfect day! 🎉'];
  document.getElementById('prog-title').textContent =
    done === 0 ? msgs[0] : done < Math.ceil(total*0.33) ? msgs[1] :
    done < Math.ceil(total*0.6) ? msgs[2] : done < total-1 ? msgs[3] :
    done < total ? msgs[4] : msgs[5];

  const list = document.getElementById('habit-list');
  list.innerHTML = '';
  HABITS.forEach(h => {
    const isActive = !h.sundayOnly || isSunday(key);
    const isDone = !!today[h.id];
    const streak = getStreak(h.id);
    const row = document.createElement('div');
    row.className = 'habit-row' + (isActive ? '' : ' disabled');

    row.innerHTML = `
      <div class="habit-icon" style="background:${h.color}22">
        <span>${h.emoji}</span>
      </div>
      <div class="habit-info">
        <div class="habit-name">
          ${h.name}
          ${h.sundayOnly ? '<span class="sunday-badge">SUN</span>' : ''}
        </div>
        <div class="habit-meta">
          ${!isActive ? 'Next Sunday' :
            streak > 0 ? `🔥 ${streak} day streak` : 'Start your streak today'}
        </div>
      </div>
      <div class="check-circle ${isDone ? 'done' : ''}" id="chk-${h.id}">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none">
          <path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    `;

    if (isActive) {
      row.addEventListener('click', () => {
        const chk = document.getElementById('chk-' + h.id);
        chk.classList.add('popping');
        chk.addEventListener('animationend', () => chk.classList.remove('popping'), { once: true });
        toggle(h.id);
      });
    }
    list.appendChild(row);
  });
}

function getLast7Days() {
  return Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (6-i));
    return {
      key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
      label: ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],
      isToday: i === 6,
      isSun: d.getDay() === 0,
    };
  });
}

function renderHistory() {
  const all = getData();
  const days = getLast7Days();
  const todayK = todayKey();

  const header = document.getElementById('week-header');
  header.innerHTML = '<span>Habit</span>';
  days.forEach(d => {
    const s = document.createElement('span');
    s.textContent = d.label;
    if (d.isToday) s.style.color = 'var(--blue)';
    header.appendChild(s);
  });

  // Stats
  const active = activeHabits(todayK);
  const todayDone = active.filter(h => all[todayK]?.[h.id]).length;
  document.getElementById('stat-today').textContent = `${todayDone}/${active.length}`;

  let weekDone = 0, weekPoss = 0;
  days.forEach(d => {
    activeHabits(d.key).forEach(h => {
      weekPoss++;
      if (all[d.key]?.[h.id]) weekDone++;
    });
  });
  document.getElementById('stat-week').textContent = weekPoss ? Math.round(weekDone/weekPoss*100)+'%' : '—';

  let best = 0;
  HABITS.forEach(h => { const s = getStreak(h.id); if (s > best) best = s; });
  document.getElementById('stat-streak').textContent = best;

  const cont = document.getElementById('history-rows');
  cont.innerHTML = '';
  HABITS.forEach(h => {
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `<div class="history-habit-name">
      <span>${h.emoji}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.name.split(' ')[0]}</span>
    </div>`;
    days.forEach(d => {
      const wrap = document.createElement('div');
      wrap.className = 'day-dot-wrap';
      const dot = document.createElement('div');
      const applicable = !h.sundayOnly || d.isSun;
      if (!applicable) {
        dot.className = 'day-dot na';
        dot.textContent = '·';
      } else {
        const done = all[d.key]?.[h.id];
        dot.className = 'day-dot' + (done ? ' done' : '') + (d.isToday ? ' today-ring' : '');
        dot.textContent = done ? '✓' : '';
      }
      wrap.appendChild(dot);
      row.appendChild(wrap);
    });
    cont.appendChild(row);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'history') renderHistory();
}

function renderNavDate() {
  const d = new Date();
  const dow = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  document.getElementById('nav-date-pill').textContent = `${dow}, ${mon} ${d.getDate()}`;
  document.getElementById('large-title').textContent =
    d.getDay() === 0 ? 'Today 🌟' : 'Today';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

renderNavDate();
renderToday();
</script>
</body>
</html>
